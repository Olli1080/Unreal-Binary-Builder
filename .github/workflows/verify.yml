name: Verify PR

on:
  push:
    branches: [ master, rework ]
  pull_request:
    branches: [ master, rework ]

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Cairo (Windows)
      if: matrix.os == 'windows-latest'
      run: choco install gtk-runtime --no-progress
      
    - name: Find and Add Cairo to Environment (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        $gtkPath = Get-ChildItem -Path "C:\Program Files\GTK3-Runtime Win64", "C:\Program Files\GTKRuntime" -Filter "bin" -Directory -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
        if ($gtkPath) {
          Write-Host "Found GTK Runtime at: $($gtkPath.FullName)"
          echo "CAIRO_BIN_DIR=$($gtkPath.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "$($gtkPath.FullName)" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        } else {
          Write-Error "GTK Runtime bin directory not found. Cairo might not be available."
        }
      
    - name: Install Cairo (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: sudo apt-get update && sudo apt-get install -y libcairo2 libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0 libffi-dev shared-mime-info
      
    - name: Install Cairo (macOS)
      if: matrix.os == 'macos-latest' || matrix.os == 'macos-13'
      run: brew install cairo pango gdk-pixbuf libffi
        
    - name: Restore Dependencies
      run: dotnet restore
      
    - name: Build Solution
      run: dotnet build --configuration Release --no-restore
      
    - name: Run Tests
      run: dotnet test --configuration Release --no-build --no-restore

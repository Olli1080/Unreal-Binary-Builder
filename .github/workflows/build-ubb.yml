name: Build and Verify

on:
  push:
    branches: [ master, rework ]
  pull_request:
    branches: [ master, rework ]

env:
  PROJECT_PATH: UnrealBinaryBuilder.Avalonia/UnrealBinaryBuilder.Avalonia.csproj

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            name: Windows-x64
            suffix: .exe
          - os: ubuntu-latest
            rid: linux-x64
            name: Linux-x64
            suffix: ""
          - os: macos-latest
            rid: osx-arm64
            name: macOS-arm64
            suffix: ""

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Inkscape (Windows) for Cairo DLLs
      if: matrix.os == 'windows-latest'
      run: winget install -e --id Inkscape.Inkscape --silent --accept-package-agreements --accept-source-agreements
      
    - name: Find and Add Cairo to Environment (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        $inkscapePath = "C:\Program Files\Inkscape\bin"
        if (Test-Path $inkscapePath) {
          Write-Host "Found Inkscape bin at: $inkscapePath"
          echo "CAIRO_BIN_DIR=$inkscapePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "$inkscapePath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        } else {
          Write-Error "Inkscape bin directory not found. Cairo might not be available."
        }
      
    - name: Install Cairo (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: sudo apt-get update && sudo apt-get install -y libcairo2 libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0 libffi-dev shared-mime-info
      
    - name: Install Cairo (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install cairo pango gdk-pixbuf libffi
        echo "DYLD_LIBRARY_PATH=/opt/homebrew/lib:/usr/local/lib:$DYLD_LIBRARY_PATH" >> $GITHUB_ENV
        echo "PKG_CONFIG_PATH=/opt/homebrew/lib/pkgconfig:/usr/local/lib/pkgconfig" >> $GITHUB_ENV
        
    - name: Restore Dependencies
      run: dotnet restore ${{ env.PROJECT_PATH }}
      
    - name: Publish
      run: dotnet publish ${{ env.PROJECT_PATH }} -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -o publish_output/${{ matrix.rid }}

    - name: Post-Build (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        Compress-Archive -Path publish_output/${{ matrix.rid }}/* -DestinationPath UnrealBinaryBuilder-${{ matrix.name }}.zip

    - name: Post-Build (Linux/macOS)
      if: matrix.os != 'windows-latest'
      run: |
        cd publish_output/${{ matrix.rid }}
        zip -r ../../UnrealBinaryBuilder-${{ matrix.name }}.zip .

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: UnrealBinaryBuilder-${{ matrix.name }}
        path: UnrealBinaryBuilder-${{ matrix.name }}.zip

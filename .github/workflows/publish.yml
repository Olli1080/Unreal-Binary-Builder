name: Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v4.0.0)'
        required: true
        default: 'v4.0.0'
      is_prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

env:
  PROJECT_PATH: UnrealBinaryBuilder.Avalonia/UnrealBinaryBuilder.Avalonia.csproj

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            name: Windows-x64
            suffix: .exe
          - os: ubuntu-latest
            rid: linux-x64
            name: Linux-x64
            suffix: ""
          - os: macos-latest
            rid: osx-arm64
            name: macOS-arm64
            suffix: ""

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Necessary for some versioning tools if used
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Inkscape (Windows) for Cairo DLLs
      if: matrix.os == 'windows-latest'
      run: winget install -e --id Inkscape.Inkscape --silent --accept-package-agreements --accept-source-agreements
      
    - name: Find and Add Cairo to Environment (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        $inkscapePath = "C:\Program Files\Inkscape\bin"
        if (Test-Path $inkscapePath) {
          Write-Host "Found Inkscape bin at: $inkscapePath"
          echo "CAIRO_BIN_DIR=$inkscapePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "$inkscapePath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        } else {
          Write-Error "Inkscape bin directory not found. Cairo might not be available."
        }
      
    - name: Install Cairo (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: sudo apt-get update && sudo apt-get install -y libcairo2 libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0 libffi-dev shared-mime-info
      
    - name: Install Cairo (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install cairo pango gdk-pixbuf libffi
        echo "DYLD_LIBRARY_PATH=/opt/homebrew/lib:/usr/local/lib:$DYLD_LIBRARY_PATH" >> $GITHUB_ENV
        echo "PKG_CONFIG_PATH=/opt/homebrew/lib/pkgconfig:/usr/local/lib/pkgconfig" >> $GITHUB_ENV
        
    - name: Configure CMake (Windows)
      if: matrix.os == 'windows-latest'
      run: cmake -G "Visual Studio 17 2022" -A x64 -B build -DCMAKE_BUILD_TYPE=Release
      
    - name: Configure CMake (Linux/macOS)
      if: matrix.os != 'windows-latest'
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      
    - name: Build with CMake
      run: cmake --build build --config Release
      
    - name: Publish
      run: dotnet publish ${{ env.PROJECT_PATH }} -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -o publish_output/${{ matrix.rid }} --no-restore

    - name: Setup Velopack
      run: dotnet tool install -g vpk

    - name: Velopack Pack
      run: |
        vpk pack --packId UnrealBinaryBuilder --packVersion ${{ github.event.inputs.version }} --packDir publish_output/${{ matrix.rid }} --mainExe UnrealBinaryBuilder.Avalonia${{ matrix.suffix }} --rid ${{ matrix.rid }} --outputDir vpk_out

    - name: Post-Build (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        Compress-Archive -Path publish_output/${{ matrix.rid }}/* -DestinationPath UnrealBinaryBuilder-${{ matrix.name }}.zip

    - name: Post-Build (Linux/macOS)
      if: matrix.os != 'windows-latest'
      run: |
        cd publish_output/${{ matrix.rid }}
        zip -r ../../UnrealBinaryBuilder-${{ matrix.name }}.zip .

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: UnrealBinaryBuilder-${{ matrix.name }}
        path: |
          UnrealBinaryBuilder-${{ matrix.name }}.zip
          vpk_out/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate Release Body
        id: release_body
        run: |
          NEW_TAG="${{ github.event.inputs.version }}"
          # Get the previous tag, fallback to first commit if none found
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)
          
          REPO_URL="https://github.com/${{ github.repository }}"
          CHANGELOG_URL="${REPO_URL}/blob/master/changelogs/${NEW_TAG}.md"
          COMPARE_URL="${REPO_URL}/compare/${PREV_TAG}...${NEW_TAG}"
          
          echo "BODY=## 📝 Release Notes" >> $GITHUB_OUTPUT
          echo "Full changelog for this version can be found here: [${NEW_TAG}.md](${CHANGELOG_URL})" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "### 🔍 Changes" >> $GITHUB_OUTPUT
          echo "View the full list of changes since ${PREV_TAG}: [Compare](${COMPARE_URL})" >> $GITHUB_OUTPUT
          
          # Multiline output handling for GitHub Actions
          {
            echo 'RELEASE_MSG<<EOF'
            echo "## 📝 Release Notes"
            echo "Full changelog for this version: [${NEW_TAG}.md](${CHANGELOG_URL})"
            echo ""
            echo "### 🔍 Changes"
            echo "View the full diff since ${PREV_TAG}: [Compare](${COMPARE_URL})"
            echo 'EOF'
          } >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          body: ${{ env.RELEASE_MSG }}
          files: |
            artifacts/*.zip
            artifacts/RELEASES
            artifacts/*.nupkg
            artifacts/*.AppImage
            artifacts/*.pkg
          generate_release_notes: true
          draft: false
          prerelease: ${{ github.event.inputs.is_prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
